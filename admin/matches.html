<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Matches | My Project</title><link rel="stylesheet" href="/admin/css/admin.css"><script type="module" src="/admin/js/match-editor.js"></script></head>
<body class="admin-body"><div class="admin-layout"><aside class="sidebar"><a class="admin-brand" href="/admin/dashboard.html">MY PROJECT<span>ADMIN PANEL</span></a><nav><a href="/admin/dashboard.html">Dashboard</a><a class="selected" href="/admin/matches.html">Manage matches</a><a href="/admin/champion.html">Manage champions</a><a href="/">View public site ↗</a></nav><button id="logout" class="btn outline">Log out</button></aside><main class="admin-main"><header class="admin-top"><div><p class="eyebrow">TOURNAMENT CONTROL</p><h1>Manage matches</h1></div></header><section class="panel"><h2 id="match-form-title">Add a match</h2><form id="match-form" class="form-grid"><input type="hidden" id="match-id"><label class="wide">Tournament name<input id="tournament" required maxlength="120"></label><label>Team A<input id="team-a" required maxlength="100"></label><label>Team B<input id="team-b" required maxlength="100"></label><label>Match date & time<input id="match-date" type="datetime-local" required></label><label>Venue<input id="venue" maxlength="150"></label><label>Status<select id="status"><option value="upcoming">Upcoming</option><option value="live">Live</option><option value="completed">Completed</option></select></label><label>Team A score<input id="score-a" type="number" min="0" value="0"></label><label>Team B score<input id="score-b" type="number" min="0" value="0"></label><label class="check"><input id="published" type="checkbox"> Published on public website</label><div class="wide actions"><button class="btn primary" type="submit">Save match</button><button class="btn outline" type="button" id="cancel-edit">Clear form</button></div></form><p id="match-message" class="message" role="status"></p></section><section class="panel"><h2>Existing matches</h2><div id="match-list" class="table-wrap">Loading…</div></section></main></div></body></html>
