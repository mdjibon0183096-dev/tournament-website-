<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Champions | My Project</title><link rel="stylesheet" href="/admin/css/admin.css"><script type="module" src="/admin/js/champion-editor.js"></script></head>
<body class="admin-body"><div class="admin-layout"><aside class="sidebar"><a class="admin-brand" href="/admin/dashboard.html">MY PROJECT<span>ADMIN PANEL</span></a><nav><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/matches.html">Manage matches</a><a class="selected" href="/admin/champion.html">Manage champions</a><a href="/">View public site ↗</a></nav><button id="logout" class="btn outline">Log out</button></aside><main class="admin-main"><header class="admin-top"><div><p class="eyebrow">HALL OF FAME CONTROL</p><h1>Manage champions</h1></div></header><section class="panel"><h2 id="champ-form-title">Add champion result</h2><form id="champ-form" class="form-grid"><input type="hidden" id="champ-id"><label class="wide">Tournament name<input id="champ-tournament" required maxlength="120"></label><label>Champion name<input id="champ-name" required maxlength="100"></label><label>Runner-up<input id="runner-up" maxlength="100"></label><label>Result date<input id="result-date" type="date"></label><label class="wide">Description<textarea id="description" rows="3" maxlength="1000"></textarea></label><label class="check"><input id="champ-published" type="checkbox"> Published on public website</label><div class="wide actions"><button class="btn primary" type="submit">Save champion</button><button class="btn outline" type="button" id="cancel-edit">Clear form</button></div></form><p id="champ-message" class="message" role="status"></p></section><section class="panel"><h2>Existing champions</h2><div id="champ-list" class="table-wrap">Loading…</div></section></main></div></body></html>
